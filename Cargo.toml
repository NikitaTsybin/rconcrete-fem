[package]
name = "mini_fem"
version = "0.1.0"
edition = "2021"
build = "build.rs"
default-run = "mini_fem"

[dependencies]
lir_asp_parser = { path = "extra/lir_asp_rust" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
encoding_rs = "0.8"
rfd = "0.15"
earcutr = "0.4"
web-time = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
geo = { version = "0.33", default-features = false }

zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
spade = "=2.15.1"
rstar = "0.12"
hayro = "=0.7.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
faer = { version = "=0.24.4", default-features = false, features = ["std", "sparse-linalg"] }

[features]
parallel-solver = []
inference-bench = []
